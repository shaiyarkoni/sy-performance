  <text x="800" y="480" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="900" fill="#c6f833" opacity="0.13" text-anchor="middle">SY</text>
  <text x="800" y="566" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#98a1a9" letter-spacing="14" text-anchor="middle">PERFORMANCE</text>
