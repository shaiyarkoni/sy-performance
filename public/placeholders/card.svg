<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2126"/>
      <stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="3" height="24" fill="#c6f833" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#stripes)"/>
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" fill="#c6f833" opacity="0.12" text-anchor="middle">SY</text>
  <text x="600" y="500" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#98a1a9" letter-spacing="10" text-anchor="middle">PERFORMANCE</text>
</svg>
